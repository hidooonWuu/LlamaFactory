### Ling 3.0 tiny (BailingMoE V3, model_type: bailing_hybrid) LoRA SFT on Ascend NPU with FSDPTurbo.
### FSDPTurbo is used purely as the FSDP2 backend here (ep_size defaults to 1); see
### train_lora_ling_v3_tiny_fsdpturbo_ep.yaml for the expert-parallel variant.
###
### Usage: USE_V1=1 llamafactory-cli sft examples/v1/train_lora/train_lora_ling_v3_tiny_fsdpturbo.yaml
model: /home/wuhaidong/model
model_class: llm
trust_remote_code: true
# The remote-code MLA always runs eager attention and needs a 4D causal mask, so LlamaFactory
# forces `sdpa` for bailing_hybrid even if `flash_attention_2` is requested here.
flash_attn: sdpa

peft_config:
  name: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all

dist_config:
  name: fsdpturbo
  dcp_path: null

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/ling_lora
micro_batch_size: 1
global_batch_size: 1
batching_workers: 0
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 3
logging_steps: 1
bf16: true
enable_activation_checkpointing: true

### sample
sample_backend: hf
max_new_tokens: 128
