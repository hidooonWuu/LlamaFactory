### Ling 3.0 tiny (BailingMoE V3, model_type: bailing_hybrid) LoRA SFT on Ascend NPU with
### FSDPTurbo expert parallelism (EP). `ep_size` must divide both the data parallel size and the
### number of routed experts (128 for Ling 3.0 tiny), and `global_batch_size` must stay divisible by
### `dp_size * micro_batch_size`.
###
### Usage: USE_V1=1 NPROC_PER_NODE=2 llamafactory-cli sft examples/v1/train_lora/train_lora_ling_v3_tiny_fsdpturbo_ep.yaml
model: /home/wuhaidong/model
model_class: llm
trust_remote_code: true
# Ling MLA dispatches through Transformers FA2; Ascend uses torch_npu fused attention.
# KDA layers retain their FLA implementation. Use sdpa to select the legacy eager MLA path.
flash_attn: flash_attention_2

peft_config:
  name: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # LlamaFactory packs routed-expert LoRA alongside frozen EP weights and exports standard PEFT keys.
  target_modules: all

dist_config:
  name: fsdpturbo
  ep_size: 2
  ep_dispatcher: eager

### data
train_dataset: /home/wuhaidong/code/LlamaFactory/data/v1_sft_demo.yaml

### training
output_dir: /home/wuhaidong/output/train_lora_ling_v3_tiny_fsdpturbo_ep_2000_1
micro_batch_size: 1
global_batch_size: 2
batching_workers: 0
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 250
logging_steps: 1
bf16: true
enable_activation_checkpointing: true
seed: 42

### sample
sample_backend: hf
max_new_tokens: 128
